     Cambios respecto de lo que hay hoy:
      - SplitText y Flip salen de aca: solo los usa home.js. Pasan al
        footer de Home. registerPlugin queda solo con ScrollTrigger,
        si no las otras paginas tiran ReferenceError.
      - El tag de Finsweet sale de aca y va por pagina. En Home y
        About no va. Es el cambio de +27 puntos en Home.
      - Lenis: version sin loop manual de rAF, sin querySelector por
        evento de scroll y sin estilos inline. -->

<script src="https://cdn.prod.website-files.com/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdn.prod.website-files.com/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script>gsap.registerPlugin(ScrollTrigger)</script>

<script src="https://unpkg.com/lenis@1.2.3/dist/lenis.min.js"></script>
<script>
// Lenis + nav auto-hide. Site-wide footer, wrap in <script> when pasting.

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches

const lenis = reduceMotion
  ? null
  : new Lenis({
      // No autoRaf: the rAF loop comes from gsap.ticker below, so Lenis and
      // ScrollTrigger stay on one clock.
      prevent: (node) => node.closest('[data-w-lightbox]') !== null,
    })

if (lenis) {
  // Lenis and ScrollTrigger have to share a clock. With Lenis on its own rAF
  // loop, ScrollTrigger kept reading the native scroll offset a frame behind
  // the position Lenis had already rendered, so triggers fired late and then
  // caught up in a single frame -- that is the jump on the entrance
  // animations. Same wiring as test/index.html.
  lenis.on('scroll', ScrollTrigger.update)
  gsap.ticker.add((time) => lenis.raf(time * 1000))
  gsap.ticker.lagSmoothing(0)

  // Parked until the DOM is done, so Lenis does not fight whatever moves the
  // offset while the page is still parsing.
  lenis.stop()
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => lenis.start(), { once: true })
  } else {
    lenis.start()
  }
}

// TODO Designer: add data-nav="component" to the nav wrapper, then drop the
// class fallback.
const nav = document.querySelector('[data-nav="component"], .nav_component')

if (nav) {
  const HIDE_AT = 50
  let hidden = null

  function syncNav(scroll) {
    const shouldHide = scroll >= HIDE_AT
    // Without this guard the toggle writes on every scroll frame instead of
    // only when the state flips.
    if (shouldHide === hidden) return
    hidden = shouldHide
    nav.classList.toggle('is-nav-hidden', shouldHide)
  }

  syncNav(window.scrollY)

  if (lenis) {
    lenis.on('scroll', ({ scroll }) => syncNav(scroll))
  } else {
    addEventListener('scroll', () => syncNav(window.scrollY), { passive: true })
  }
}
</script>

<script>
// Existing site-wide footer block: fade-up / stagger entrances and the
// divider line animations.

// fade-up: individual elements fade in + slide up
document.querySelectorAll('[data-animate="fade-up"]').forEach((el) => {
  gsap.set(el, { opacity: 0, y: 20 })
  gsap.to(el, {
    opacity: 1,
    y: 0,
    duration: 0.7,
    ease: 'power2.out',
    scrollTrigger: {
      trigger: el,
      start: 'top 85%',
      toggleActions: 'play none none none',
    },
  })
})

// stagger: direct children fade in + slide up with stagger
document.querySelectorAll('[data-animate="stagger"]').forEach((container) => {
  const children = container.children
  if (!children.length) return
  gsap.set(children, { opacity: 0, y: 20 })
  gsap.to(children, {
    opacity: 1,
    y: 0,
    duration: 0.7,
    stagger: 0.12,
    ease: 'power2.out',
    scrollTrigger: {
      trigger: container,
      start: 'top 85%',
      toggleActions: 'play none none none',
    },
  })
})
// Line animations: horizontal (center->edges) and vertical (top->bottom).

// Horizontal lines: scaleX 0→1 from center, then corner icons
document.querySelectorAll('.horizontal_line-wrapper').forEach((wrapper) => {
  const line = wrapper.querySelector('.horizontal_line')
  const icons = wrapper.querySelectorAll('.horizontal_icon')
  if (!line) return

  gsap.set(line, { scaleX: 0, transformOrigin: '50% 50%' })
  gsap.set(icons, { opacity: 0, scale: 0 })

  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: wrapper,
      start: 'top 90%',
      toggleActions: 'play none none none',
    },
  })

  tl.to(line, {
    scaleX: 1,
    duration: 1.2,
    ease: 'power2.inOut',
  })
  tl.to(icons, {
    opacity: 1,
    scale: 1,
    duration: 0.4,
    stagger: 0.15,
    ease: 'back.out(1.4)',
  }, '-=0.15')
})

// Vertical lines: scaleY 0→1 top to bottom, then plus icons
document.querySelectorAll('.vertical_line-wrapper').forEach((wrapper) => {
  const line = wrapper.querySelector('.vertical_line')
  const icons = wrapper.querySelectorAll('.vertical_icon')
  if (!line) return

  gsap.set(line, { scaleY: 0, transformOrigin: '50% 0%' })
  gsap.set(icons, { opacity: 0, scale: 0 })

  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: wrapper,
      start: 'top 90%',
      toggleActions: 'play none none none',
    },
  })

  tl.to(line, {
    scaleY: 1,
    duration: 1.2,
    ease: 'power2.inOut',
  })
  tl.to(icons, {
    opacity: 1,
    scale: 1,
    duration: 0.4,
    stagger: 0.15,
    ease: 'back.out(1.4)',
  }, '-=0.15')
})
</script>

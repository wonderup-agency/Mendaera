<script>
;(function () {
  // Browsers default to scrollRestoration 'auto' and put the page back where it
  // was on reload. It looks intermittent because the restore only lands if the
  // document is already tall enough by then, and here the videos and CMS lists
  // arrive late.
  if (!('scrollRestoration' in history)) return
  history.scrollRestoration = 'manual'

  // Fragment links are not history restoration. Leave them alone.
  if (location.hash) return

  // Stop resetting as soon as the visitor scrolls, or the load handler drags
  // them back mid-read: first paint here is ~1.2 s out on slow 4G.
  var userMoved = false
  function markUser() { userMoved = true }
  var INTENT = ['wheel', 'touchstart', 'keydown', 'pointerdown']
  for (var i = 0; i < INTENT.length; i++) {
    addEventListener(INTENT[i], markUser, { passive: true, capture: true })
  }

  function toTop() {
    if (!userMoved) window.scrollTo(0, 0)
  }

  // 'manual' covers the restore; these cover Webflow IX and Lenis moving the
  // offset while the page settles.
  toTop()
  document.addEventListener('DOMContentLoaded', toTop, { once: true })
  addEventListener('load', toTop, { once: true })

  // bfcache restores reuse the live document, so nothing above fires. Drop this
  // line if back navigation should keep the visitor's place.
  addEventListener('pageshow', function (e) { if (e.persisted) toTop() })
})()
</script>

<script>
;(function () {
  // Gate for the [data-animate] start state in the head stylesheet. The class
  // only has to survive the gap between first paint and the footer script that
  // hands these elements to GSAP; once GSAP owns them its inline opacity wins,
  // so dropping the class later changes nothing. If the footer never runs the
  // timer is what keeps the content from staying invisible.
  var html = document.documentElement
  if (!html.classList) return
  html.classList.add('md-anim')
  setTimeout(function () {
    html.classList.remove('md-anim')
  }, 2500)
})()
</script>

<script>
;(function () {
  // Webflow's Optimize (Intellimize) integration drops a full-page curtain over
  // the site: it adds `anti-flicker` to <html>, and its own stylesheet is
  //
  //   .anti-flicker, .anti-flicker * { visibility: hidden !important;
  //                                    opacity: 0 !important; }
  //
  // The class comes off when the 86 KB snippet finishes loading, or after the
  // integration's own 4000 ms timeout — whichever happens first.
  //
  // Measured on About, slow 4G / 4x CPU: the entire page is invisible for
  // 3.5 s, at every scroll position. Scrolling during that window shows white,
  // and content appears the exact millisecond the class comes off (blank.about
  // in audit/out: body.visibility flips from hidden to visible at 3512 ms and
  // the first content pixel lands at 3512 ms). Blocking the snippet moves the
  // first pixel to 1.2 s.
  //
  // And it is hiding nothing: intellimize.getSelectedVariationIds() returns
  // undefined on all five pages, getActivities() only ever logs `pv` events,
  // and the DOM is node-for-node identical with the snippet blocked
  // (audit/intellimize-check.mjs). There is no variation to flash.
  //
  // So: cap the curtain instead of waiting out the 4 s. 600 ms is longer than
  // the snippet takes on any warm/desktop connection, so a real experiment
  // would still apply before the reveal; on a slow connection the page shows
  // through rather than staying blank.
  //
  // The real fix is turning the integration off in Webflow — that also removes
  // 86 KB of blocking JS. This block is what to keep if the pageview tracking
  // has to stay. If an experiment ever ships, raise CAP or delete this block.
  var CAP = 600
  var html = document.documentElement
  var CLASS = 'anti-flicker'

  function lift() {
    if (html.classList) html.classList.remove(CLASS)
    else html.className = html.className.replace(new RegExp(' ?' + CLASS), '')
  }

  // This snippet is pasted at the top of the Head field, which Webflow renders
  // *after* its integration script — so the class is already on <html> here and
  // a plain timer is enough. The rAF guard keeps the reveal on a paint boundary
  // when the main thread is busy parsing.
  setTimeout(function () {
    if (window.requestAnimationFrame) window.requestAnimationFrame(lift)
    else lift()
  }, CAP)
})()
</script>

<script>
;(function () {
  // The <video> elements carry their src in the markup, so the browser starts
  // downloading during HTML parsing — long before the footer custom code runs.
  // Measured on Home mobile (slow 4G / 4x CPU): 8.4 MB of video in flight
  // before the first content pixel, starving fonts and posters of bandwidth
  // until second 9.
  //
  // This block disarms every video as the parser inserts it (strips src and
  // autoplay) and rearms it only when something actually wants to play it.
  // play() is patched so the existing call sites keep working unchanged.

  var SRC = 'mdSrc'
  var AUTO = 'mdAutoplay'
  var disarmed = []

  function stash(el) {
    if (el.dataset[SRC] != null) return
    var src = el.getAttribute('src')
    if (!src) return
    el.dataset[SRC] = src
    el.removeAttribute('src')
  }

  // Note: the poster CANNOT be optimized from here. It sits on the <video>
  // opening tag, so the browser fires its fetch the moment it creates the
  // element — before this observer can run. Measured: rewriting it downloads
  // both versions (576 KB + 28 KB). The poster has to change in the markup.
  // See README, section 2.2.

  function disarm(video) {
    if (video.dataset.mdDisarmed) return

    // preload="none" is enough for a video nothing autoplays: the browser
    // fetches nothing until something calls play().
    video.preload = 'none'

    // Only autoplay videos get their src stripped. Stripping it from the rest
    // breaks any code that reads the URL off the element instead of calling
    // play() — careers/custom.js does exactly that to build its lightbox:
    //
    //   const videoSrc = source.getAttribute('src')
    //   if (!videoSrc) return            // <- bailed out, click never bound
    //
    // The bandwidth win comes from the autoplay videos anyway: those are the
    // ones the browser downloads on its own, before any script runs.
    if (!video.autoplay && !video.hasAttribute('autoplay')) return

    video.dataset.mdDisarmed = '1'
    video.dataset[AUTO] = '1'
    video.autoplay = false
    video.removeAttribute('autoplay')
    stash(video)
    for (var i = 0; i < video.children.length; i++) {
      if (video.children[i].tagName === 'SOURCE') stash(video.children[i])
    }
    disarmed.push(video)
  }

  function rearm(video) {
    if (!video.dataset.mdDisarmed || video.dataset.mdArmed) return
    video.dataset.mdArmed = '1'
    var restored = false
    function put(el) {
      if (el.dataset[SRC] != null) {
        el.setAttribute('src', el.dataset[SRC])
        delete el.dataset[SRC]
        restored = true
      }
    }
    put(video)
    for (var i = 0; i < video.children.length; i++) {
      if (video.children[i].tagName === 'SOURCE') put(video.children[i])
    }
    video.preload = 'auto'
    // load() re-runs the resource selection algorithm. Without it the restored
    // <source> is ignored, because the element already went through its
    // initial selection.
    if (restored) { try { video.load() } catch (e) {} }
  }

  window.mdVideo = { rearm: rearm }

  // Any existing .play() rearms the video before playing, so the call sites in
  // home.js / tech.js / about-page.js need no changes.
  var proto = window.HTMLMediaElement && HTMLMediaElement.prototype
  if (proto && proto.play) {
    var origPlay = proto.play
    proto.play = function () {
      if (this.dataset && this.dataset.mdDisarmed) rearm(this)
      return origPlay.apply(this, arguments)
    }
  }

  // Safety net: native controls start playback without ever calling the JS
  // play() method, so the patch above would never fire for them.
  addEventListener('pointerdown', function (e) {
    var video = e.target && e.target.closest && e.target.closest('video[data-md-disarmed]')
    if (video) rearm(video)
  }, true)

  // The observer runs during parsing, before the video is inserted with its
  // src ready to download.
  if (window.MutationObserver) {
    new MutationObserver(function (records) {
      // While parsing, the observer gets one mutation per node the parser
      // opens — thousands of them. Running querySelectorAll('video') on each
      // is quadratic and measured ~1.5 s of LCP. During parsing it is enough
      // to look at the node itself: the parser inserts every element on its
      // own, so a <video> shows up as an addedNode in its own right. The deep
      // search is only needed for subtrees injected later by JS (Swiper
      // clones, CMS items).
      var parsing = document.readyState === 'loading'
      for (var r = 0; r < records.length; r++) {
        var added = records[r].addedNodes
        for (var n = 0; n < added.length; n++) {
          var node = added[n]
          if (node.nodeType !== 1) continue
          if (node.tagName === 'VIDEO') disarm(node)
          else if (node.tagName === 'SOURCE' && node.parentNode && node.parentNode.tagName === 'VIDEO') {
            if (node.parentNode.dataset.mdDisarmed) stash(node)
          } else if (!parsing && node.firstElementChild && node.querySelectorAll) {
            var inner = node.querySelectorAll('video')
            for (var v = 0; v < inner.length; v++) disarm(inner[v])
          }
        }
      }
    }).observe(document.documentElement, { childList: true, subtree: true })
  }

  // Home ships two hero <video> elements that share the same id AND the same
  // source: the desktop hero and a smaller variant. Both are visible and both
  // sit within the observer's rootMargin, so the same 6.7 MB file was being
  // downloaded twice — 13.4 MB of a 15.3 MB page. Neither is display:none, so
  // visibility alone cannot tell them apart.
  //
  // Keep one element per source: the one with the largest rendered area, which
  // is the one the current breakpoint actually shows. This is a workaround for
  // duplicated markup; the duplicate itself still belongs in the Designer fix.
  function dedupeBySource(videos) {
    var best = {}
    videos.forEach(function (v) {
      var src = v.dataset[SRC] || v.currentSrc || ''
      var source = v.querySelector && v.querySelector('source')
      if (!src && source) src = source.dataset[SRC] || source.getAttribute('src') || ''
      if (!src) { best['@' + Math.random()] = v; return }
      var rect = v.getBoundingClientRect()
      var area = rect.width * rect.height
      var current = best[src]
      if (!current || area > current.area) best[src] = { el: v, area: area }
    })
    return Object.keys(best).map(function (k) { return best[k].el || best[k] })
  }

  // Videos that had autoplay get their behavior back, but only after load and
  // only once they are near the viewport.
  function activateAutoplay() {
    var pending = disarmed.filter(function (v) { return v.dataset[AUTO] === '1' && !v.dataset.mdArmed })
    pending = dedupeBySource(pending)
    if (!pending.length) return
    if (!window.IntersectionObserver) {
      pending.forEach(function (v) { var p = v.play(); if (p && p.catch) p.catch(function () {}) })
      return
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return
        io.unobserve(entry.target)
        var p = entry.target.play()
        if (p && p.catch) p.catch(function () {})
      })
    }, { rootMargin: '200px 0px' })
    pending.forEach(function (v) { io.observe(v) })
  }

  addEventListener('load', function () {
    if (window.requestIdleCallback) requestIdleCallback(activateAutoplay, { timeout: 1200 })
    else setTimeout(activateAutoplay, 400)
  })
})()
</script>

<style>
/* Goes with footer-lenis.js: the nav hides via a class, not an inline style.
   Paste into Project settings > Custom code > Head, inside <style>. */
.nav_component {
  transition: transform 0.3s cubic-bezier(0.215, 0.61, 0.355, 1);
}
.nav_component.is-nav-hidden {
  transform: translateY(-100%);
}

/* Goes with the [data-animate] entrances in the site-wide footer. GSAP applies
   opacity 0 / y 20 only when that script runs, which is after first paint: the
   element is painted in place, then blinks out and drops 20 px before fading
   back. Setting the start state from the head means it is never painted wrong.
   The md-anim gate comes from the head snippet and is dropped on a timer, so a
   footer that never runs leaves content visible instead of blank. */
html.md-anim [data-animate="fade-up"],
html.md-anim [data-animate="stagger"] > * {
  opacity: 0;
  transform: translateY(20px);
}
</style>
